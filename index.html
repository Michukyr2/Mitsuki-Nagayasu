<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* zoo-inspired palette: savanna sand, bark, foliage, lion mane */
    --bg:#F5EEDC;
    --surface:#FFFCF4;
    --ink:#2B2416;
    --ink-soft:#8A7A5C;
    --line:#E7DCC0;
    --accent:#3F6B45;      /* foliage green — done */
    --accent-soft:#E1EBDD;
    --wip:#C1832B;         /* lion mane amber — in progress */
    --wip-soft:#FBEDD4;
    --todo:#8C7758;        /* rock / bark — not started */
    --todo-soft:#EFE7D5;
    --high:#BD5B27;        /* tiger orange — high priority */
    --high-soft:#F6E3D2;
    --mid:#C1832B;         /* savanna gold — mid priority */
    --mid-soft:#FBEDD4;
    --low:#4C7A5B;         /* jungle green — low priority */
    --low-soft:#E1EBE1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'Space Mono',monospace;}
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }

  /* Header */
  header{
    padding:28px 20px 18px;
    position:sticky;top:0;z-index:10;
    background:var(--bg);
  }
  .title-row{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:4px;
  }
  h1{
    margin:0;font-size:22px;font-weight:900;letter-spacing:.01em;
  }
  .count{
    font-size:12px;color:var(--ink-soft);
  }
  .count b{color:var(--ink);}

  /* Filter tabs */
  .tabs{
    display:flex;gap:6px;margin-top:16px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .tab{
    flex:0 0 auto;
    font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:20px;
    background:var(--surface);
    color:var(--ink-soft);
    border:1px solid var(--line);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .tab.active{
    background:var(--ink);color:#fff;border-color:var(--ink);
  }
  .tab .n{opacity:.6;margin-left:5px;font-family:'Space Mono',monospace;font-size:11px;}

  /* Add bar */
  .add-form{
    margin:14px 20px 6px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    display:flex;flex-direction:column;gap:10px;
    box-shadow:0 1px 0 rgba(27,31,35,0.02);
  }
  .add-row1{display:flex;gap:8px;}
  .add-form input[type="text"]{
    flex:1;
    border:none;outline:none;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:15px;
    padding:10px 12px;
    background:var(--bg);
    border-radius:8px;
    color:var(--ink);
  }
  .add-form input[type="text"]::placeholder{color:#9AA0A6;}
  .add-form input[type="text"].shake{animation:shake .32s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }
  .priority-picker{
    display:flex;gap:6px;
  }
  .picker-row{
    display:flex;align-items:center;gap:10px;
  }
  .picker-label{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    flex:0 0 auto;width:38px;
  }
  .chip-group{
    display:flex;gap:6px;flex:1;
  }
  .chip{
    flex:1;
    text-align:center;
    font-size:12.5px;font-weight:700;
    padding:8px 0;border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s;
    user-select:none;
  }
  .schip[data-s="未着手"].sel{background:var(--todo-soft);border-color:var(--todo);color:var(--todo);}
  .schip[data-s="着手中"].sel{background:var(--wip-soft);border-color:var(--wip);color:var(--wip);}
  .schip[data-s="完了"].sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .pchip[data-p="高"].sel{background:var(--high-soft);border-color:var(--high);color:var(--high);}
  .pchip[data-p="中"].sel{background:var(--mid-soft);border-color:var(--mid);color:var(--mid);}
  .pchip[data-p="低"].sel{background:var(--low-soft);border-color:var(--low);color:var(--low);}
  .add-btn{
    border:none;border-radius:8px;
    background:var(--ink);color:#fff;
    font-size:14px;font-weight:700;
    padding:10px 18px;
    cursor:pointer;
    transition:opacity .15s;
    white-space:nowrap;
  }
  .add-btn:active{opacity:.75;}
  .add-btn:disabled{background:#C7C9C4;cursor:not-allowed;}

  /* List */
  main{
    flex:1;
    padding:18px 20px 60px;
  }
  .list{
    display:flex;flex-direction:column;gap:10px;
  }
  .task{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px 14px 0;
    display:flex;
    align-items:flex-start;
    gap:0;
    position:relative;
    overflow:hidden;
    animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .flag{
    width:5px;align-self:stretch;border-radius:3px;
    margin-right:14px;flex:0 0 5px;
  }
  .flag.高{background:var(--high);}
  .flag.中{background:var(--mid);}
  .flag.低{background:var(--low);}

  .task-body{flex:1;min-width:0;}
  .task-name{
    font-size:15.5px;
    line-height:1.5;
    word-break:break-word;
    margin-bottom:8px;
  }
  .task.done .task-name{
    color:#A6A9A4;
    text-decoration:line-through;
  }
  .task-meta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .status-pill{
    font-size:12px;font-weight:700;
    padding:5px 12px;border-radius:20px;
    border:none;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:transform .1s;
  }
  .status-pill:active{transform:scale(.96);}
  .status-pill::before{
    content:"";width:6px;height:6px;border-radius:50%;
  }
  .status-pill.未着手{background:var(--todo-soft);color:var(--todo);}
  .status-pill.未着手::before{background:var(--todo);}
  .status-pill.着手中{background:var(--wip-soft);color:var(--wip);}
  .status-pill.着手中::before{background:var(--wip);}
  .status-pill.完了{background:var(--accent-soft);color:var(--accent);}
  .status-pill.完了::before{background:var(--accent);}

  .p-badge{
    font-size:11px;font-weight:700;
    padding:4px 10px;border-radius:20px;
    font-family:'Space Mono',monospace;
    border:none;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;
    transition:transform .1s;
  }
  .p-badge:active{transform:scale(.94);}
  .p-badge .a{font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;}
  .p-badge.高{background:var(--high-soft);color:var(--high);}
  .p-badge.中{background:var(--mid-soft);color:var(--mid);}
  .p-badge.低{background:var(--low-soft);color:var(--low);}

  .del-btn{
    background:none;border:none;
    color:#C4C7C0;
    cursor:pointer;
    padding:6px 6px 6px 10px;
    flex:0 0 auto;
    align-self:flex-start;
    transition:color .15s;
  }
  .del-btn:hover{color:var(--high);}
  .del-btn svg{display:block;width:18px;height:18px;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .glyph{font-size:34px;margin-bottom:12px;}
  .empty p{margin:0;font-size:14px;}

  @media (max-width:400px){
    header{padding:22px 16px 14px;}
    .add-form{margin:14px 16px 6px;}
    main{padding:18px 16px 60px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>Todo</h1>
      <div class="count mono"><b id="remainCount">0</b> 件 未完了</div>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="add-form" id="addForm">
    <div class="add-row1">
      <input type="text" id="nameInput" placeholder="タスクを入力…" maxlength="80" autocomplete="off">
      <button type="button" class="add-btn" id="addBtn">追加</button>
    </div>
    <div class="picker-row">
      <span class="picker-label">状態</span>
      <div class="chip-group" id="statusPicker">
        <div class="chip schip sel" data-s="未着手">未着手</div>
        <div class="chip schip" data-s="着手中">着手中</div>
        <div class="chip schip" data-s="完了">完了</div>
      </div>
    </div>
    <div class="picker-row">
      <span class="picker-label">優先度</span>
      <div class="chip-group" id="priorityPicker">
        <div class="chip pchip" data-p="高">🦁 高</div>
        <div class="chip pchip sel" data-p="中">🐘 中</div>
        <div class="chip pchip" data-p="低">🐢 低</div>
      </div>
    </div>
  </div>

  <main>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none;">
      <div class="glyph">🗒️</div>
      <p>タスクはまだありません</p>
    </div>
  </main>
</div>

<script>
(function(){
  const STATUSES = ["未着手","着手中","完了"];
  const PRIORITIES = ["高","中","低"];
  const P_ANIMAL = {"高":"🦁","中":"🐘","低":"🐢"};
  const FILTERS = [
    {key:"all", label:"すべて"},
    {key:"未着手", label:"未着手"},
    {key:"着手中", label:"着手中"},
    {key:"完了", label:"完了"},
  ];

  let tasks = [
    {id: cryptoId(), name:"サンプルタスクを削除して自分のタスクを追加", status:"未着手", priority:"中"},
  ];
  let currentFilter = "all";
  let selectedPriority = "中";
  let selectedStatus = "未着手";

  function cryptoId(){
    return 't' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const tabsEl = document.getElementById('tabs');
  const remainCountEl = document.getElementById('remainCount');
  const addForm = document.getElementById('addForm');
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  const priorityPicker = document.getElementById('priorityPicker');
  const statusPicker = document.getElementById('statusPicker');

  function renderTabs(){
    tabsEl.innerHTML = '';
    FILTERS.forEach(f=>{
      const n = f.key === 'all' ? tasks.length : tasks.filter(t=>t.status===f.key).length;
      const el = document.createElement('div');
      el.className = 'tab' + (currentFilter === f.key ? ' active' : '');
      el.innerHTML = f.label + '<span class="n">' + n + '</span>';
      el.addEventListener('click', ()=>{ currentFilter = f.key; render(); });
      tabsEl.appendChild(el);
    });
  }

  function nextStatus(s){
    const i = STATUSES.indexOf(s);
    return STATUSES[(i+1) % STATUSES.length];
  }

  function nextPriority(p){
    const i = PRIORITIES.indexOf(p);
    return PRIORITIES[(i+1) % PRIORITIES.length];
  }

  function renderList(){
    const filtered = currentFilter === 'all' ? tasks : tasks.filter(t=>t.status===currentFilter);
    listEl.innerHTML = '';
    emptyEl.style.display = filtered.length ? 'none' : 'block';

    filtered.forEach(t=>{
      const row = document.createElement('div');
      row.className = 'task' + (t.status === '完了' ? ' done' : '');

      const flag = document.createElement('div');
      flag.className = 'flag ' + t.priority;
      row.appendChild(flag);

      const body = document.createElement('div');
      body.className = 'task-body';

      const nameEl = document.createElement('div');
      nameEl.className = 'task-name';
      nameEl.textContent = t.name;
      body.appendChild(nameEl);

      const meta = document.createElement('div');
      meta.className = 'task-meta';

      const statusBtn = document.createElement('button');
      statusBtn.type = 'button';
      statusBtn.className = 'status-pill ' + t.status;
      statusBtn.textContent = t.status;
      statusBtn.title = 'タップで状態を変更';
      statusBtn.addEventListener('click', ()=>{
        t.status = nextStatus(t.status);
        render();
      });
      meta.appendChild(statusBtn);

      const pBadge = document.createElement('button');
      pBadge.type = 'button';
      pBadge.className = 'p-badge ' + t.priority;
      pBadge.title = 'タップで優先度を変更';
      pBadge.innerHTML = '<span class="a">' + P_ANIMAL[t.priority] + '</span>優先度 ' + t.priority;
      pBadge.addEventListener('click', ()=>{
        t.priority = nextPriority(t.priority);
        render();
      });
      meta.appendChild(pBadge);

      body.appendChild(meta);
      row.appendChild(body);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'del-btn';
      delBtn.setAttribute('aria-label','削除');
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
      delBtn.addEventListener('click', ()=>{
        tasks = tasks.filter(x=>x.id!==t.id);
        render();
      });
      row.appendChild(delBtn);

      listEl.appendChild(row);
    });
  }

  function render(){
    renderTabs();
    renderList();
    remainCountEl.textContent = tasks.filter(t=>t.status!=='完了').length;
  }

  priorityPicker.addEventListener('click', (e)=>{
    const chip = e.target.closest('.pchip');
    if(!chip) return;
    selectedPriority = chip.dataset.p;
    [...priorityPicker.children].forEach(c=>c.classList.toggle('sel', c===chip));
  });

  statusPicker.addEventListener('click', (e)=>{
    const chip = e.target.closest('.schip');
    if(!chip) return;
    selectedStatus = chip.dataset.s;
    [...statusPicker.children].forEach(c=>c.classList.toggle('sel', c===chip));
  });

  // Guard against IME composition (Japanese input) triggering an early
  // add when the user presses Enter to confirm kanji conversion.
  let isComposing = false;
  nameInput.addEventListener('compositionstart', ()=>{ isComposing = true; });
  nameInput.addEventListener('compositionend', ()=>{ isComposing = false; });

  function addTask(){
    const name = nameInput.value.trim();
    if(!name){
      nameInput.classList.remove('shake');
      // force reflow so the animation can re-trigger on repeated empty submits
      void nameInput.offsetWidth;
      nameInput.classList.add('shake');
      nameInput.focus();
      return;
    }
    tasks.unshift({id:cryptoId(), name, status:selectedStatus, priority:selectedPriority});
    nameInput.value = '';
    render();
    nameInput.focus();
  }

  // No <form>/submit here on purpose — some embedded viewers restrict form
  // submission, so the add action is wired directly to a plain button click
  // and to Enter on the text field instead.
  addBtn.addEventListener('click', ()=>{
    addTask();
  });

  nameInput.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter') return;
    if(isComposing || e.isComposing){
      // Enter is confirming IME conversion, not submitting the task.
      return;
    }
    e.preventDefault();
    addTask();
  });

  render();
})();
</script>
</body>
</html>
